---
# Call asserts
- name: check for asserts
  ansible.builtin.include_tasks: asserts.yml

# tasks file for fbsd-cleanup-rc-config
- name: read in the rc.conf file 
  register: my_file_contents
  ansible.builtin.slurp:
    src: "{{ fbsd_cleanup_rc_config_rc_src }}" 

- name: create variable from decoded content of the file
  ansible.builtin.set_fact:
    decoded_content: "{{ my_file_contents['content'] | b64decode | split('\n') }}"

 #
 # Hostname and basic networking section
 #
- name: parse content for section_1
  loop:
    "{{ decoded_content }}"
  when: >
    'ifconfig_' in item or
    'hostname=' in item or
    'defaultrouter=' in item
  ansible.builtin.set_fact:
     fbsd_cleanup_rc_config_section_1: "{{ fbsd_cleanup_rc_config_section_1 | default([]) + [item]  }}"

#
# Services section
#
- name: parse content for section_2
  loop:
    "{{ decoded_content }}"
  when: >
    '_enable=' in item 
  ansible.builtin.set_fact:
    fbsd_cleanup_rc_config_section_2: "{{ fbsd_cleanup_rc_config_section_2 | default([]) + [item]  }}"

#
# Service flags section
#
- name: parse content for section_3
  loop:
    "{{ decoded_content }}"
  when: >
    '_flags=' in item 
  ansible.builtin.set_fact:
    fbsd_cleanup_rc_config_section_3: "{{ fbsd_cleanup_rc_config_section_3 | default([]) + [item]  }}"

 #
 # Driver load section
 #
- name: parse content for section_4
  loop:
    "{{ decoded_content }}"
  when: >
    'kld_load=' in item 
  ansible.builtin.set_fact:
    fbsd_cleanup_rc_config_section_4: "{{ fbsd_cleanup_rc_config_section_4 | default([]) + [item]  }}"

#
# Miscellaneous
#
- name: parse content for section_5
  loop:
    "{{ decoded_content }}"
  when: >
    'ifconfig_' not in item and
    'hostname=' not in item and
    '_enable=' not in item and
    'defaultrouter=' not in item and
    '_flags=' not in item and
    'kld_load=' not in item and
    '#' not in item and
    item | length > 0 
  ansible.builtin.set_fact:
    fbsd_cleanup_rc_config_section_5: "{{ fbsd_cleanup_rc_config_section_5 | default([]) + [item]  }}"

- name: Write out the new rc.conf
  ansible.builtin.template:
    src: rc.conf.j2
    dest: "{{ fbsd_cleanup_rc_config_rc_dest }}"
    backup: "{{ fbsd_cleanup_rc_config_backup_conf }}"
    force: true
